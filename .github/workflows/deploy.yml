name: Deploy to Fly.io

on:
  workflow_dispatch:

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: go test
        run: go test ./internal/mediabot/...

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: [lint, tests]
    concurrency: deploy-group

    steps:
      - uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      # fly.toml carries no `app` key, so the app name comes from the
      # FLY_APP repo secret. MEDIABOT_PUBLIC_URL is the bot's base URL.
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only -c .infra/prod/fly.toml -a "$FLY_APP"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ secrets.FLY_APP }}

      - name: Health Check
        env:
          PUBLIC_URL: ${{ secrets.MEDIABOT_PUBLIC_URL }}
        run: |
          echo "Waiting for deployment to be healthy..."
          sleep 30
          curl -f "$PUBLIC_URL/health" || echo "Health check failed, but deployment may still be in progress"
