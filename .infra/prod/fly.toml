# fly.toml — production config for the Telegram bot.
# See https://fly.io/docs/reference/configuration/
#
# Deploy:  make deploy   (reads FLY_APP from .env)
# Build context is the repo root, so all [build] paths are relative to there.
#
# The `app` key is deliberately absent so this public repo does not name the
# deployment. flyctl takes the app name from `-a` / $FLY_APP instead, and
# prefers that over any name in this file. Every flyctl command for this repo
# therefore needs an app name; the Makefile targets supply it.

primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'
  ignorefile = '.dockerignore'
  [build.args]
    GO_VERSION = '1.26'

[env]
  PORT = '8080'
  MEDIABOT_TEMP_DIR = '/tmp/mediabot'
  MEDIABOT_MAX_CONCURRENT_DOWNLOADS = '3'
  YTDLP_PATH = '/usr/local/bin/yt-dlp'
  # MEDIABOT_PUBLIC_URL (base URL for webhook registration and the keep-alive
  # self-ping) is set as a Fly secret, not here, so the public repo does not
  # name the deployment. See the deployment runbook in CLAUDE.md.

# Webhook-driven bot with zero-scale: machine stops on HTTP idle and Fly's
# proxy auto-starts it on the next Telegram webhook POST. The bot's keep-alive
# goroutine pings /health every 2 min while downloads are active so long
# downloads are not cut off mid-flight.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  # On shared-cpu-1x the VM is occasionally preempted, so a 5s timeout + 30s
  # interval produces false-positive "health check failed" log lines even
  # though the bot is healthy. Relaxed values eliminate the noise.
  [[http_service.checks]]
    grace_period = '15s'
    interval = '60s'
    method = 'GET'
    timeout = '10s'
    path = '/health'

[[vm]]
  memory = '512Mb'
  cpu_kind = 'shared'
  cpus = 1
